<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Local Swarm · Board</title>
<style>
:root {
 color-scheme:light;
 --ink:#172432; --sub:#4d5c6c; --line:#dce4eb; --soft:#f4f7fa;
 --blue:#164c84; --good:#216341; --warn:#855413; --bad:#a12e36;
}
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; font:14px/1.5 system-ui,sans-serif; color:var(--ink); background:var(--soft) }
h1,h2,h3,p { margin:0 }
h2 { font-size:17px }
h3 { font-size:14px }
button,input,select { font:inherit; color:inherit }
button,input[type=search],select {
 min-height:36px; padding:5px 10px; border:1px solid #aab9c9; border-radius:6px; background:#fff;
}
button,summary,select { cursor:pointer }
button:hover:not(:disabled),summary:hover { background:var(--soft) }
button:disabled { opacity:.65; cursor:default }
:focus-visible { outline:2px solid #1768b5; outline-offset:2px }
.wrap { max-width:1020px; margin:auto; padding-inline:20px }
header { background:#fff; border-bottom:1px solid var(--line) }
.heading { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px 8px }
.heading h1 { font-size:20px; letter-spacing:-.02em }
.connection { font-size:12px; color:var(--sub); text-align:right }
.connection[data-state=connected] { color:var(--good) }
.connection[data-state=retry] { color:var(--warn) }
nav { display:flex; gap:6px; align-items:center; overflow:auto }
nav button { border:0; border-radius:0; border-bottom:2px solid transparent; padding-inline:12px; font-weight:600; color:var(--sub) }
nav button[aria-selected=true] { color:var(--blue); border-bottom-color:var(--blue) }
nav button:focus-visible { outline-offset:-3px }
main { padding-block:16px 24px }
.panel,.notice { background:#fff; border:1px solid var(--line); border-radius:9px; overflow-wrap:anywhere }
.panel { padding:14px 16px }
.notice { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding:8px 12px; margin-bottom:12px }
.toolbar,.filters,.feed-foot,.headline,.replay {
 display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center;
}
.toolbar input[type=search] { flex:1 1 155px; min-width:0 }
.toolbar button[aria-expanded=true] { background:var(--soft) }
.check { display:inline-flex; align-items:center; gap:5px; min-height:36px; white-space:nowrap; cursor:pointer }
.filters { padding:8px 0 2px }
.filters select { max-width:100%; min-width:0 }
.feed-scroll { height:clamp(13rem,calc(100dvh - 15rem),60rem); overflow:auto; overflow-anchor:none; overscroll-behavior:contain; margin-top:10px; padding:3px; }
.feed-scroll:focus-visible { outline-offset:0 }
.older { margin:0 0 6px 3px }
.newer { margin:6px 0 0 3px }
.feed-foot { justify-content:space-between; padding-top:6px; min-height:42px }
.timeline,.roster,.links,.plan-list,.task-list { list-style:none; margin:0; padding:0 }
.timeline > li,.roster > li,.links > li,.plan-list > li,.task-list > li { border-top:1px solid var(--line) }
.message summary { list-style:none; padding:7px 6px; display:block; border-radius:4px }
.message summary::-webkit-details-marker { display:none }
.message-meta { display:inline-flex; align-items:center; gap:9px }
.headline { justify-content:space-between }
.identity { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; min-width:0 }
.meta { color:var(--sub); font-size:12px }
.when { white-space:nowrap }
.preview { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; white-space:pre-line; margin:2px 0 0 }
.message[open] .preview { display:none }
.message-body,.details-body { white-space:pre-wrap; margin:3px 0 10px; overflow-wrap:anywhere }
.message-body { padding:0 6px 2px }
.pill { display:inline-flex; align-items:center; padding:1px 6px; border-radius:4px; background:var(--soft); color:var(--sub); font-size:11px; line-height:1.5 }
.pill[data-tone=good] { color:var(--good); background:#edf7f0 }
.pill[data-tone=warn] { color:var(--warn); background:#fff6e5 }
.pill[data-tone=bad] { color:var(--bad); background:#fdefef }
.empty { color:var(--sub); padding:12px 4px }
.group { margin-bottom:16px }
.group:last-child { margin-bottom:0 }
.group h2 { font-size:13px; color:var(--sub); margin-bottom:4px }
.member-row,.disclosure { display:block; text-align:left; width:100%; border:0; border-radius:4px; padding:8px 6px }
.member-row .meta,.disclosure .meta { display:block }
.disclosure .identity::before,.message-meta::after {
 content:""; align-self:center; flex:none; width:6px; height:6px;
 border:solid var(--sub); border-width:0 1px 1px 0; transform:rotate(-45deg);
}
.disclosure[aria-expanded=true] .identity::before,.message[open] .message-meta::after { transform:rotate(45deg) }
.disclosure[aria-expanded=false] strong {
 display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
}
.plan-list,.connections { margin-top:10px }
.task-list { margin:0 0 10px 16px }
.task-details { display:grid; grid-template-columns:minmax(90px,auto) minmax(0,1fr); gap:4px 10px; margin:3px 6px 12px; font-size:13px }
.task-details dt { color:var(--sub) }
.task-details dd { margin:0; white-space:pre-wrap }
.revision { font-family:ui-monospace,monospace; user-select:all }
.replay { margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line) }
.replay input { flex:1 1 130px; min-width:0; accent-color:var(--blue) }
.replay output { flex-basis:100% }
#view-graph .toolbar { margin-bottom:8px }
.graph-frame { overflow:auto; border:1px solid var(--line); border-radius:6px; background:var(--soft) }
.graph-frame svg { display:block; margin:auto }
.links li { padding:5px 0 }
.connections-nav { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-top:8px }
.sr-only { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; white-space:nowrap }
@media(max-width:600px) {
 .wrap { padding-inline:11px }
 .panel { padding:10px }
 .filters select { width:100% }
 .task-details { grid-template-columns:minmax(0,1fr); gap:0 }
 .task-details dd { margin-bottom:5px }
}
</style>
</head>
<body>
<header>
<div class="wrap heading"><h1>LocalSwarm</h1><div id="connection" class="connection" role="status">Connecting to local board…</div></div>
<nav class="wrap" role="tablist" aria-label="Workspace views">
<button id="tab-board" type="button" role="tab" aria-controls="view-board" aria-selected="true" tabindex="0">Board</button>
<button id="tab-members" type="button" role="tab" aria-controls="view-members" aria-selected="false" tabindex="-1">Members</button>
<button id="tab-graph" type="button" role="tab" aria-controls="view-graph" aria-selected="false" tabindex="-1">Graph</button>
<button id="tab-plans" type="button" role="tab" aria-controls="view-plans" aria-selected="false" tabindex="-1">Plans</button>
</nav>
</header>
<main class="wrap">
<div id="notice" class="notice" hidden>
<p id="notice-text" role="status"></p>
<div><button id="reconnect" type="button">Retry connection</button> <button id="demo" type="button">Load demo</button></div>
</div>
<section id="view-board" class="panel" role="tabpanel" aria-labelledby="tab-board">
<div class="toolbar">
<label for="search" class="sr-only">Search messages</label>
<input id="search" type="search" placeholder="Search messages">
<button id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
<label class="check"><input id="follow" type="checkbox" checked> Follow</label>
</div>
<div id="filters" class="filters" hidden>
<label class="sr-only" for="member-direction">Message direction</label>
<select id="member-direction"><option value="either">From or to</option><option value="from">From</option><option value="to">To</option></select>
<label class="sr-only" for="member-filter">Member filter</label>
<select id="member-filter"><option value="">Anyone</option></select>
<label class="check"><input id="all-events" type="checkbox"> All events</label>
</div>
<div id="feed-scroll" class="feed-scroll" role="region" aria-label="Messages" tabindex="0">
<button id="older" type="button" class="older" hidden>Load earlier messages</button>
<ol id="activity" class="timeline"></ol><p id="board-empty" class="empty" hidden></p>
<button id="newer" type="button" class="newer" hidden>Load newer messages</button>
</div>
<div class="feed-foot"><span id="event-count" class="meta"></span><button id="latest" type="button" hidden>Jump to latest</button></div>
</section>
<section id="view-members" class="panel" role="tabpanel" aria-labelledby="tab-members" hidden>
<div id="roster"></div><p id="members-empty" class="empty" hidden>No members yet.</p>
</section>
<section id="view-graph" class="panel" role="tabpanel" aria-labelledby="tab-graph" hidden>
<div class="replay">
<label for="scrub" class="sr-only">Replay position</label>
<input id="scrub" type="range" min="0" max="0" value="0" step="1" disabled>
<button id="play" type="button" disabled>Play</button><button id="live" type="button" disabled>Live</button>
<output id="clock" for="scrub" class="meta">No events</output>
</div>
<div class="toolbar">
<label class="sr-only" for="graph-member">Graph member</label>
<input id="graph-member" type="search" placeholder="Filter graph by member">
</div>
<div id="canvas" class="graph-frame" hidden></div><p id="graph-empty" class="empty" hidden>No members or mentions at this position.</p>
<details id="edge-summary" class="connections" hidden>
<summary>Connections</summary><ul id="edges" class="links"></ul>
<div class="connections-nav"><button id="previous-edges" type="button">Previous</button><span id="edge-page" class="meta"></span><button id="next-edges" type="button">Next</button></div>
</details>
</section>
<section id="view-plans" class="panel" role="tabpanel" aria-labelledby="tab-plans" hidden>
<p id="plan-hint" class="meta" role="status" hidden></p>
<ul id="plans" class="plan-list"></ul><p id="plans-empty" class="empty" hidden></p>
</section>
</main>
<script>
"use strict";
(() => {
const byId=id=>document.getElementById(id);
const $={
 connection:byId("connection"), notice:byId("notice"), note:byId("notice-text"),
 retry:byId("reconnect"), demo:byId("demo"),
 scrub:byId("scrub"), play:byId("play"), live:byId("live"), clock:byId("clock"),
 activity:byId("activity"), eventCount:byId("event-count"), boardEmpty:byId("board-empty"),
 feed:byId("feed-scroll"), search:byId("search"), filters:byId("filters"), filtersToggle:byId("filters-toggle"),
 direction:byId("member-direction"), member:byId("member-filter"), allEvents:byId("all-events"),
 follow:byId("follow"), older:byId("older"), newer:byId("newer"), latest:byId("latest"),
 roster:byId("roster"), membersEmpty:byId("members-empty"),
 canvas:byId("canvas"), graphEmpty:byId("graph-empty"), edgeSummary:byId("edge-summary"), edges:byId("edges"),
 graphMember:byId("graph-member"), previousEdges:byId("previous-edges"), nextEdges:byId("next-edges"), edgePage:byId("edge-page"),
};
const tabNames=["board","members","graph","plans"];
const pageSize=50;
const maxMessages=5*pageSize;
const canConnect=location.protocol==="http:"||location.protocol==="https:" ? ["localhost","127.0.0.1","[::1]"].includes(location.hostname) : false;
const requests=new Map();
let plans=[],planStale=false,openPlan=null,openTask=null,expandedTask=null;
let feedRows=new Map(),filterNames=[];
let feed=emptyFeed();
let graph=null,graphIndex=null,graphThrough=null,graphOffset=0,graphNext=null;
let source=null,retryTimer=null,replayTimer=null,refreshTimer=null,interactionTimer=null,pollTimer=null;
let lastSeen=0,retryDelay=800,refreshPending=false,bootstrapped=false,suspended=false,isDemo=false,activeTab="board";

function emptyFeed(){
 return {items:[],through:0,total:0,pending:0,older:false,newer:false,scroll:0,atEnd:true,loaded:false};
}
const clean=v=>typeof v==="string"?v.trim():"";
function node(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n;}
function el(tag,ns){const n=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const [k,v] of Object.entries(ns||{}))n.setAttribute(k,String(v));return n;}
function tone(s){if(/complete|success|ready|idle|done|online|passed/i.test(s))return "good";if(/fail|error|blocked|cancel/i.test(s))return "bad";if(/run|wait|queue|pause|work|busy|pending|implement|verif/i.test(s))return "warn";return "neutral";}
function pill(s){const n=node("span",s||"Not recorded","pill");n.dataset.tone=tone(s||"");return n}
function seqOf(v){if(typeof v!=="number"&&(typeof v!=="string"||!/^[0-9]+$/.test(v)))return null;const n=Number(v);return Number.isSafeInteger(n)&&n>=0?n:null;}
function normalEvent(raw){
 if(!raw||typeof raw!=="object")return null;
 const seq=seqOf(raw.seq); if(seq===null)return null;
 return {seq,actor:clean(raw.actor),mentions:Array.isArray(raw.mentions)?raw.mentions.map(clean).filter(Boolean):[],content:typeof raw.content==="string"?raw.content:"",status:clean(raw.status),created_at:clean(raw.created_at),kind:clean(raw.kind),source:clean(raw.source)};
}
function normalMember(raw){const name=clean(raw?.name);return name?{name,role:clean(raw.role),status:raw.active?"Running":clean(raw.status),backend:clean(raw.backend),model:clean(raw.model),effort:clean(raw.reasoning_effort),lastMessage:seqOf(raw.last_message)}:null;}
function labelText(v){return typeof v==="object"&&v?clean(v.message)||clean(v.reason)||clean(v.summary)||clean(v.id)||clean(v.name):clean(v);}
function labels(v){return (Array.isArray(v)?v:[v]).map(labelText).filter(Boolean);}
function normalTask(t){
 const id=clean(t?.id)||clean(t?.task_id); if(!id)return null;
 const revision=[t.review_sha,t.revision?.sha,t.revision,t.sha,t.commit_sha,t.commit].find(v=>typeof v==="string"&&/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(v))||"";
 return {id,brief:clean(t.brief)||clean(t.goal)||clean(t.title),criterion:clean(t.criterion),waiting:labels(t.waiting_on),attempt:Number.isInteger(t.attempt)&&t.attempt>0?String(t.attempt):"",state:clean(t.state)||clean(t.status),needs:labels(t.needs??t.dependencies??t.depends_on),worker:labelText(t.worker??t.assignee),verifier:labelText(t.verifier??t.reviewer),notes:[...new Set([...labels(t.blockers??t.blocker),...labels(t.diagnostic??t.reason??t.error)])],revision,evidence:labelText(t.evidence),integrated:typeof t.integrated==="boolean"?t.integrated:null};
}
function setPlans(s){
 planStale=false;
 plans=(Array.isArray(s?.plans)?s.plans:[]).flatMap(p=>{
  const id=clean(p?.id)||clean(p?.plan_id);if(!id)return [];
  return [{id,goal:clean(p.goal)||clean(p.title),state:clean(p.state)||clean(p.status),tasks:(Array.isArray(p.tasks)?p.tasks:[]).map(normalTask).filter(Boolean)}];
 });
}
function timeString(value){if(!value)return "";const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});}
function statusMessage(message,state=""){ $.connection.textContent=message;$.connection.dataset.state=state; }
function notice(message,allowRetry=false,allowDemo=true){$.notice.hidden=!message;$.note.textContent=message||"";$.retry.hidden=!allowRetry;$.demo.hidden=!allowDemo;}
function activate(name,focus=false){
 if(activeTab!==name){
  cancelView();
  if(activeTab==="plans")expandedTask=null;
 }
 activeTab=name;document.title="Local Swarm · "+name[0].toUpperCase()+name.slice(1);
 for(const t of tabNames){const selected=name===t, tab=byId("tab-"+t);tab.setAttribute("aria-selected",String(selected));tab.tabIndex=selected?0:-1;byId("view-"+t).hidden=!selected;}
 if(focus)byId("tab-"+name).focus();
 refreshView();
 updatePolling();
}
function updateTimeline(){
 const count=graph?.total??0,index=graphIndex??count;
 $.scrub.max=count;$.scrub.value=index;$.scrub.disabled=!count;$.play.disabled=!count;$.live.disabled=graphThrough===null;
 const sequence=graph?.index===index&&graph.seq?" · #"+graph.seq+(graph.created_at?" · "+timeString(graph.created_at):""):"";
 const msg=graphIndex===null ? count?"Latest · "+count+" event"+(count===1?"":"s"):"No events" :
  index?"Replay "+index+" of "+count+sequence : "Replay start · Before first event";
 $.clock.textContent=msg;$.scrub.setAttribute("aria-valuetext",msg);
 $.play.textContent=playing?"Pause":index===count?"Replay":"Play";$.play.setAttribute("aria-label",playing?"Pause replay":index===count?"Replay from beginning":"Play replay");
}
const attentionStatuses=new Set(["blocked","failed","interrupted","limited","error","cancelled","canceled"]);
const completeStatuses=new Set(["done","complete","completed","passed","success"]);
function updateMemberFilter(names){
 const sorted=Array.from(new Set([...names,$.member.value].filter(Boolean))).sort((a,b)=>a.localeCompare(b));
 if(sorted.length===filterNames.length&&sorted.every((name,i)=>name===filterNames[i]))return;
 const previous=$.member.value;
 $.member.replaceChildren(new Option("Anyone",""),...sorted.map(name=>new Option(name,name)));
 $.member.value=previous;
 filterNames=sorted;
}
function messageRow(e){
 const item=node("li"),details=node("details",undefined,"message"),summary=node("summary");
 const head=node("div",undefined,"headline"), identity=node("div",undefined,"identity");
 identity.append(node("strong",e.actor||"Unattributed"));
 if(e.mentions.length)identity.append(node("span","→ "+e.mentions.join(", "),"meta"));
 if(e.status)identity.append(pill(e.status));
 head.append(identity);
 const stamp=timeString(e.created_at), when=node("time",stamp,"meta when"), end=node("span",undefined,"message-meta");
 if(stamp){
  if(!Number.isNaN(new Date(e.created_at).getTime()))when.dateTime=e.created_at;
  end.append(when);
 }
 head.append(end);
 summary.append(head);
 if(e.content)summary.append(node("p",e.content.length>300?e.content.slice(0,300)+"…":e.content,"preview"));
 details.append(summary,node("p","#"+e.seq+" · "+(e.source||e.kind||"Recorded event"),"meta message-body"));
 if(e.content)details.append(node("p",e.content,"message-body"));
 item.append(details);
 return item;
}
function syncFeed(items){
 const next=new Map(items.map(e=>[e.seq,feedRows.get(e.seq)||messageRow(e)]));
 for(const [seq,row] of feedRows){
  if(!next.has(seq))row.remove();
 }
 let sibling=$.activity.firstElementChild;
 for(const row of next.values()){
  if(row===sibling)sibling=sibling.nextElementSibling;
  else $.activity.insertBefore(row,sibling);
 }
 feedRows=next;
}
function renderBoard({pin=false}={}){
 const all=$.allEvents.checked,filterCount=Number(Boolean($.member.value))+Number(all);
 $.filtersToggle.textContent=filterCount?"Filters ("+filterCount+")":"Filters";
 const top=$.feed.getBoundingClientRect().top;
 const anchor=Array.from(feedRows.values()).find(row=>row.getBoundingClientRect().bottom>top);
 const inset=anchor?anchor.getBoundingClientRect().top-top:0;
 const previousFocus=document.activeElement;
 $.older.hidden=!feed.older;
 $.newer.hidden=!feed.newer;
 syncFeed(feed.items);
 if(pin)$.feed.scrollTop=$.feed.scrollHeight;
 else if(anchor?.isConnected)$.feed.scrollTop+=anchor.getBoundingClientRect().top-top-inset;
 else $.feed.scrollTop=feed.scroll;
 feed.scroll=$.feed.scrollTop;
 feed.atEnd=atFeedEnd();
 $.boardEmpty.hidden=feed.items.length>0;
 $.boardEmpty.textContent=feed.error?"Messages could not be loaded.":
  !feed.loaded?"Loading messages…":feed.pending?"New messages are available.":
  $.search.value.trim()||filterCount?"No matching messages.":"No messages yet.";
 $.eventCount.textContent=feed.loaded?
  feed.items.length+" of "+(feed.total+feed.pending)+(all?" events":" messages"):"";
 updateLatest();
 if([$.older,$.newer,$.latest].includes(previousFocus)&&previousFocus.hidden){
  $.feed.focus({preventScroll:true});
 }
}
function atFeedEnd(){
 return $.feed.scrollHeight-$.feed.clientHeight-$.feed.scrollTop<=10;
}
function updateLatest(){
 $.latest.textContent=feed.pending?"Jump to latest ("+feed.pending+" new)":"Jump to latest";
 $.latest.hidden=!feed.pending&&!feed.newer&&atFeedEnd();
}
function setFiltersOpen(open){
 $.filters.hidden=!open;
 $.filtersToggle.setAttribute("aria-expanded",String(open));
}
function resetFeed(delay=0){
 abortRequest("feed");
 clearInteraction();
 feed=emptyFeed();
 if(activeTab!=="board")return;
 renderBoard();
 if(delay)interactionTimer=setTimeout(()=>{interactionTimer=null;loadFeed("latest");},delay);
 else loadFeed("latest");
}
function renderMembers(states){
 const groups=new Map([["Coordinator",[]],["Needs attention",[]],["Active",[]],["Standing by",[]],["Other members",[]]]);
 const focusName=$.roster.contains(document.activeElement)?document.activeElement.dataset.member:"";
 let focusButton=null;
 for(const m of states){
  const coordinator=m.name.toLowerCase()==="coordinator"||m.role.toLowerCase()==="coordinator";
  const state=m.status.toLowerCase();
  const group=coordinator?"Coordinator":attentionStatuses.has(state)?"Needs attention":
   state==="running"?"Active":completeStatuses.has(state)||state==="waiting"||state==="idle"?"Standing by":"Other members";
  groups.get(group).push(m);
 }
 const frag=document.createDocumentFragment();
 for(const [label,members] of groups){
  if(!members.length)continue;
  const section=node("section",undefined,"group"),list=node("ul",undefined,"roster");
  section.append(node("h2",label),list);
  for(const m of members){
   const item=node("li"),button=node("button",undefined,"member-row"),head=node("span",undefined,"headline");
   button.type="button";button.dataset.member=m.name;
   head.append(node("strong",m.name),pill(m.status));
   button.append(head);
   const model=[m.role,m.backend,m.model,m.effort].filter(Boolean).join(" · ");
   if(model)button.append(node("span",model,"meta"));
   if(m.lastMessage!==null)button.append(node("span","Latest message #"+m.lastMessage,"meta"));
   button.addEventListener("click",()=>{
    updateMemberFilter([...filterNames,m.name]);
    $.search.value="";$.direction.value="either";$.member.value=m.name;
    setFiltersOpen(true);feed=emptyFeed();activate("board",true);
   });
   if(m.name===focusName)focusButton=button;
   item.append(button);list.append(item);
  }
  frag.append(section);
 }
 $.membersEmpty.hidden=frag.childNodes.length>0;
 $.roster.replaceChildren(frag);
 focusButton?.focus({preventScroll:true});
}
function renderGraph(data){
 $.canvas.replaceChildren();$.edges.replaceChildren();
 const {nodes:visible,edges,connections}=data;
 $.canvas.hidden=!visible.length;$.graphEmpty.hidden=!!visible.length;$.edgeSummary.hidden=!connections.length&&!graphOffset;
 $.graphEmpty.textContent=$.graphMember.value.trim()?"No matching members or mentions.":"No members or mentions at this position.";
 for(const edge of connections){
  $.edges.append(node("li",edge.from+" → "+edge.to+" · "+edge.count+" mention"+(edge.count===1?"":"s")));
 }
 $.previousEdges.disabled=graphOffset===0;$.nextEdges.disabled=graphNext===null;
 const count=data.connections_total??0;

function abortRequest(key){

}
function clearInteraction(){

}
function cancelView(){

 clearInteraction();
 clearInterval(pollTimer);pollTimer=null;
 stopReplay();
}
async function request(key,endpoint,params,apply,failed){
 if(suspended||(!canConnect&&!isDemo))return;
 abortRequest(key);
 const controller=new AbortController();
 requests.set(key,controller);
 try{
  const urlParams=new URLSearchParams();
  for(const [name,value] of Object.entries(params)){
   if(value!==null&&value!==undefined&&value!=="")urlParams.set(name,String(value));
  }
  let data;
  if(isDemo)data=demoResponse(endpoint,urlParams);
  else{
   const suffix=urlParams.size?"?"+urlParams:"";
   const response=await fetch("/board/"+endpoint+suffix,{
    cache:"no-store",credentials:"same-origin",redirect:"error",signal:controller.signal,
   });
   if(!response.ok)throw new Error("Board data unavailable");
   data=await response.json();
  }
  if(!controller.signal.aborted)apply(data);
 }catch(error){
  if(!controller.signal.aborted)failed?.(error);
 }finally{
  if(requests.get(key)===controller){
   requests.delete(key);
   if(refreshPending)scheduleRefresh();
  }
 }
}
function queryOptions(){

}
function mergeEvents(a,b){

}
function loadFeed(mode){
 const query=queryOptions();
 if(mode==="older"){query.before=feed.items[0]?.seq;query.through=feed.through;}
 else if(mode==="newer"){query.after=feed.items.at(-1)?.seq;query.through=feed.through;}
 else if(mode==="live")query.after=feed.through;
 else if(mode==="count"){query.after=feed.through;query.through=feed.through;}
 return request("feed","messages",query,page=>{
  const automatic=mode==="live"||mode==="live-latest";
  if(automatic&&(!$.follow.checked||!feed.atEnd||!atFeedEnd()||feed.newer)){
   feed.pending=Math.max(0,page.total+page.pending-feed.total);
   renderBoard();
   return;
  }
  if(mode==="live"&&page.next_after!==null){loadFeed("live-latest");return;}
  const items=page.events.map(normalEvent).filter(Boolean).slice(0,pageSize);
  if(feed.error&&source?.readyState===EventSource.OPEN)notice("");
  feed.error=false;
  feed.loaded=true;feed.total=page.total;feed.pending=page.pending;
  if(!bootstrapped)lastSeen=Math.max(lastSeen,page.latest_seq);
  const browsingOlder=mode==="older",paging=mode==="newer"||browsingOlder;
  if(mode==="latest"||mode==="live-latest"){
   feed.items=items;
   feed.older=page.next_before!==null;
   feed.newer=false;
  }else if(paging||mode==="live"){
   const merged=mergeEvents(feed.items,items);
   const overflow=merged.length>maxMessages;
   feed.items=browsingOlder?merged.slice(0,maxMessages):merged.slice(-maxMessages);
   if(browsingOlder){
    feed.older=page.next_before!==null;
    feed.newer=feed.newer||overflow;
   }else {
    feed.older=feed.older||overflow;
    feed.newer=paging&&page.next_after!==null;
   }
  }
  feed.through=page.through;
  renderBoard({pin:mode==="latest"||automatic});
 },()=>{
  feed.error=true;
  renderBoard();
  if(!bootstrapped){
   statusMessage("Local board offline");
   notice("Open the private board URL from the local service.",true);
  }else if(mode!=="count")notice("Messages could not be refreshed. Showing the last received results.",true,false);
 });
}
function loadMembers(render=true){

function refreshView(){

function disconnect(){
 if(source){source.close();source=null;}
 clearTimeout(retryTimer);retryTimer=null;
 updatePolling();
}
function openStream(){
 if(!canConnect||isDemo||suspended||source)return;
 const own=new EventSource("/events?compact=1&since="+encodeURIComponent(lastSeen));
 source=own;
 own.onopen=()=>{
  if(source!==own)return;
  retryDelay=800;statusMessage("Local board live","connected");notice("");
  updatePolling();scheduleRefresh();
 };
 own.onmessage=message=>{
  if(source!==own)return;
  try{
   const seq=seqOf(JSON.parse(message.data).seq);
   if(seq!==null&&seq>lastSeen){lastSeen=seq;scheduleRefresh();}
  }catch(_){/* Ignore malformed notifications. */}
 };
 own.onerror=()=>{
  if(source!==own)return;
  disconnect();statusMessage("Reconnecting to local board…","retry");
  notice("Showing the last received results.",true);
  retryTimer=setTimeout(()=>{retryTimer=null;openStream();},retryDelay);
  retryDelay=Math.min(12000,retryDelay*2);

let connectAttempt=0;
async function connect(){

  isDemo=false;bootstrapped=false;lastSeen=0;
  feed=emptyFeed();plans=[];openPlan=null;openTask=null;expandedTask=null;
  graph=null;graphIndex=null;graphThrough=null;graphOffset=0;

const samplePlans=[{plan_id:"sample",goal:"Verify a local release note",status:"passed",tasks:[

function demoResponse(endpoint,params){
 const latest_seq=sampleEvents.length;
 if(endpoint==="plans")return {plans:samplePlans,latest_seq};
 if(endpoint==="task")return {task:samplePlans[0].tasks.find(task=>task.id===params.get("task_id"))};
 if(endpoint==="members")return {members:sampleMembers,names:sampleMembers.map(member=>member.name),latest_seq};
 if(endpoint==="graph"){
  const index=params.has("index")?Number(params.get("index")):latest_seq;
  const member=(params.get("member")||"").toLowerCase();
  const items=sampleEvents.slice(0,index);
  const edges=items.flatMap(e=>e.mentions.map(to=>({from:e.actor,to,count:1})))
   .filter(edge=>[edge.from,edge.to].some(name=>name.toLowerCase().includes(member)));
  const names=new Set(edges.flatMap(edge=>[edge.from,edge.to]));
  const nodes=index===0?[]:sampleMembers.filter(m=>names.has(m.name)||(!member&&index===latest_seq));
  return {index,total:latest_seq,through:latest_seq,seq:index,created_at:items.at(-1)?.created_at,
   nodes,edges,connections:edges,connections_total:edges.length,next_offset:null};
 }
 const q=(params.get("q")||"").toLowerCase(),member=params.get("member"),direction=params.get("direction");
 const after=Number(params.get("after")||0),before=Number(params.get("before")||latest_seq+1);
 const through=Number(params.get("through")??latest_seq);
 const matches=sampleEvents.filter(e=>e.content.toLowerCase().includes(q)&&
  (!member||(direction!=="to"&&e.actor===member)||(direction!=="from"&&e.mentions.includes(member))));
 const events=matches.filter(e=>e.seq<=through&&e.seq>after&&e.seq<before);
 return {events,latest_seq,through,total:matches.filter(e=>e.seq<=through).length,
  pending:matches.filter(e=>e.seq>through).length,next_after:null,next_before:null};
}
